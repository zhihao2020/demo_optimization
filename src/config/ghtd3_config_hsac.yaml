# Hierarchical-SAC HMSD (H-SAC)
# Low-level: max-entropy hybrid SAC (continuous + CAES categorical)
# High-level: TD3 + MS-HER (kept)
# MSGP: weak / fast-annealed market prior (ablation showed strong prior hurts mean J)
# No hybrid teacher residual

ghtd3:
  enabled: true
  subgoal_interval: 8
  goal_dim: 5
  goal_low:  [-0.30, -0.12, -0.10, -0.20, 0.0]
  goal_high: [ 0.30,  0.12,  0.10,  0.20, 1.0]
  # Weaker goal tracking so low-level SAC can chase extrinsic J
  intrinsic_weights: [1.0, 0.9, 0.15, 0.25]  # bat, gas, th, u_tp
  intrinsic_alpha: 0.35
  intrinsic_alpha_end: 0.10
  hybrid_anchor: false
  hybrid_anchor_path: null
  hybrid_init_low: false
  execution_mode: goal_conditioned
  residual_init: false
  goal_input_scale: 4.0
  low_use_raw_obs: false
  obs_norm: true
  obs_scale: 1.0e6
  mle_pretrain_residual: false
  mle_fit_mode: false
  # --- Hierarchical-SAC low level ---
  low_level_algo: sac
  low_target_entropy: -4.1   # -(3 + log 3)
  low_alpha_lr: 3.0e-4
  low_alpha_max: 1.0         # hard clamp; prevents alpha blow-up
  actor_bc_weight: 0.0       # pure max-ent; no buffer BC on low actor
  # F-MLE warm-start still useful for mode/thermal structure
  f_mle_pretrain: true
  f_mle_low: true
  f_mle_high: true
  f_mle_windows: 4
  f_mle_epochs_low: 20
  f_mle_epochs_high: 20
  # Explore: SAC low handles stochasticity; keep mild high-level noise
  high_explore_noise: 0.04
  low_explore_noise: 0.0
  epsilon_start: 0.20
  epsilon_end: 0.05
  gamma: 0.99
  tau: 0.005
  policy_delay: 1
  actor_lr: 2.0e-4
  critic_lr: 3.0e-4
  target_noise: 0.2
  noise_clip: 0.5
  q_clip: 200.0
  q_clip_high: 50.0
  high_reward_normalize: true
  high_buffer_size: 30000
  low_buffer_size: 150000
  high_batch_size: 64
  low_batch_size: 128
  learning_starts_low: 512
  learning_starts_high: 64
  gradient_steps_low: 2
  gradient_steps_high: 4
  # MS-HER kept for high-level variance
  goal_relabel: true
  goal_relabel_mode: ms_her
  ms_her_weighting: true
  ms_her_p_mkt: 0.10
  ms_her_min_weight: 0.35
  ms_her_max_weight: 2.5
  relabel_p_orig: 0.35
  relabel_p_ach: 0.35
  relabel_candidates: 8
  # --- Weak MSGP (ablation: strong prior hurts mean J) ---
  market_goal_prior: true
  market_prior_weight: 0.22
  market_prior_weight_end: 0.04
  market_prior_anneal_start: 0.15
  market_prior_strength: 0.10
  charge_threshold: 0.40
  discharge_threshold: 0.90
  recovery_goal_horizon_steps: 40
  recovery_prior_weight: 0.55
  phase_a_steps: 2500
  goal_dropout: 0.0
  log_every: 500
  price_aware_bootstrap: true
  bc_pretrain: true
  bc_pretrain_low: true
  bc_pretrain_high: true
  bc_windows: 4
  bc_epochs_low: 20
  bc_epochs_high: 20
  high_lambda_soc: false
  tariff_aligned_c: false
  use_shadow: false

soc_keys:
  - battery_soc
  - caes_gas_soc
