# TEA Stable：安全可扩张（SOC 屏障 + 回收期回教师 + 中等 β_max）
# 原理：参考调速器 — 仅在安全库存带内允许大残差；期末收缩到教师保 SoC 门控
# 目标：多种子 mean 仍 ≥ Hybrid，SOC 全过

ghtd3:
  enabled: true
  subgoal_interval: 24
  goal_dim: 5
  goal_low:  [-0.30, -0.12, -0.10, -0.20, 0.0]
  goal_high: [ 0.30,  0.12,  0.10,  0.20, 1.0]
  intrinsic_weights: [1.5, 1.2, 0.25, 0.4]
  intrinsic_alpha: 0.40
  intrinsic_alpha_end: 0.20
  hybrid_anchor: true
  hybrid_anchor_path: runs/market_bc_rl_60k_20260803/checkpoints/hybrid_givesafe_td3.pt
  hybrid_init_low: false
  execution_mode: tea
  tea_expandable: true
  residual_init: true
  residual_beta_tp: 0.12
  residual_beta_bat: 0.28
  residual_beta_mag: 0.08
  # 中等扩张：小于 WS2 的 bat=1.0，大于 ares 固定小 β
  tea_beta_max_tp: 0.42
  tea_beta_max_bat: 0.55
  tea_beta_max_mag: 0.05
  tea_rho_start: 0.28
  tea_rho_end: 0.92
  tea_adv_gate: true
  tea_adv_temp: 0.55
  tea_mode_unlock_progress: 0.99
  tea_force_mode_lock: true
  tea_safe_expansion: true
  tea_soc_lo: 0.20
  tea_soc_hi: 0.90
  tea_recovery_beta_floor: 0.10
  tea_recovery_bc_floor: 0.32
  tea_terminal_soc_penalty: 0.55
  tea_mag_dev_penalty: 0.10
  tea_teacher_bc_coef0: 0.42
  tea_teacher_bc_coef1: 0.12
  residual_mode_margin: 1.5
  residual_mode_override: false
  residual_logit_clip: 8.0
  residual_beta_from_arb: true
  residual_beta_price_gate: true
  residual_price_gate_thr: 0.68
  residual_price_gate_boost: 1.25
  goal_input_scale: 4.0
  residual_alpha0: 0.0
  residual_alpha_max: 0.28
  residual_train_start: 0
  obs_norm_high_only: false
  low_use_raw_obs: false
  mle_pretrain_residual: true
  mle_fit_mode: false
  mle_epochs: 25
  mle_windows: 4
  high_explore_noise: 0.035
  low_explore_noise: 0.035
  epsilon_start: 0.16
  epsilon_end: 0.04
  gamma: 0.99
  tau: 0.005
  policy_delay: 1
  actor_lr: 2.0e-4
  residual_actor_lr: 1.0e-4
  critic_lr: 3.0e-4
  target_noise: 0.2
  noise_clip: 0.5
  reward_clip: [-25.0, 25.0]
  q_clip: 200.0
  q_clip_high: 50.0
  high_reward_normalize: true
  high_buffer_size: 30000
  low_buffer_size: 120000
  high_batch_size: 64
  low_batch_size: 128
  learning_starts_low: 512
  learning_starts_high: 64
  gradient_steps_low: 2
  gradient_steps_high: 4
  goal_relabel: true
  goal_relabel_mode: her_mix
  relabel_p_orig: 0.35
  relabel_p_ach: 0.45
  relabel_candidates: 8
  market_goal_prior: true
  market_prior_weight: 0.55
  market_prior_weight_end: 0.12
  market_prior_anneal_start: 0.22
  market_prior_strength: 0.15
  charge_threshold: 0.40
  discharge_threshold: 0.90
  recovery_goal_horizon_steps: 48
  recovery_prior_weight: 0.97
  phase_a_steps: 0
  goal_dropout: 0.0
  actor_bc_weight: 0.14
  obs_norm: true
  obs_scale: 1.0e6
  log_every: 500
  price_aware_bootstrap: true
  bc_pretrain: true
  bc_pretrain_low: false
  bc_pretrain_high: true
  bc_windows: 4
  bc_epochs_low: 20
  bc_epochs_high: 25
  use_shadow: false

soc_keys:
  - battery_soc
  - caes_gas_soc
