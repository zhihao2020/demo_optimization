# TEA Stable v2：更贴教师、更硬回收（多 seed SOC 优先，再谈扩张收益）
# 变更相对 v1（s0/s1/s2 40k 失败诊断）：
#   - β_max 再降一档（防 bat 过大漂移 / CAES 间接吞吐）
#   - mag 几乎不扩张；mode 全程锁教师
#   - 回收窗加长 + β floor 更低 + BC floor 更高
#   - SOC 安全带收窄；mag 偏离罚抬高
# 验收：3 seed × 3 季 SOC 全过；mean Δ≥0；CAES MWh ≤ Hybrid×1.2

ghtd3:
  enabled: true
  subgoal_interval: 24
  goal_dim: 5
  goal_low:  [-0.30, -0.12, -0.10, -0.20, 0.0]
  goal_high: [ 0.30,  0.12,  0.10,  0.20, 1.0]
  intrinsic_weights: [1.5, 1.2, 0.25, 0.4]
  intrinsic_alpha: 0.40
  intrinsic_alpha_end: 0.20
  hybrid_anchor: true
  hybrid_anchor_path: runs/market_bc_rl_60k_20260803/checkpoints/hybrid_givesafe_td3.pt
  hybrid_init_low: false
  execution_mode: tea
  tea_expandable: true
  residual_init: true
  residual_beta_tp: 0.10
  residual_beta_bat: 0.22
  residual_beta_mag: 0.04
  # v2 小扩张：介于 ares 固定小 β 与 v1 中等扩张之间
  tea_beta_max_tp: 0.28
  tea_beta_max_bat: 0.38
  tea_beta_max_mag: 0.02
  tea_rho_start: 0.35
  tea_rho_end: 0.82
  tea_adv_gate: true
  tea_adv_temp: 0.65
  tea_mode_unlock_progress: 0.99
  tea_force_mode_lock: true
  tea_safe_expansion: true
  tea_soc_lo: 0.24
  tea_soc_hi: 0.88
  tea_recovery_beta_floor: 0.05
  tea_recovery_bc_floor: 0.45
  tea_terminal_soc_penalty: 0.85
  tea_mag_dev_penalty: 0.22
  tea_teacher_bc_coef0: 0.50
  tea_teacher_bc_coef1: 0.18
  residual_mode_margin: 1.5
  residual_mode_override: false
  residual_logit_clip: 8.0
  residual_beta_from_arb: true
  residual_beta_price_gate: true
  residual_price_gate_thr: 0.72
  residual_price_gate_boost: 1.12
  goal_input_scale: 4.0
  residual_alpha0: 0.0
  residual_alpha_max: 0.22
  residual_train_start: 0
  obs_norm_high_only: false
  low_use_raw_obs: false
  mle_pretrain_residual: true
  mle_fit_mode: false
  mle_epochs: 25
  mle_windows: 4
  high_explore_noise: 0.028
  low_explore_noise: 0.028
  epsilon_start: 0.14
  epsilon_end: 0.035
  gamma: 0.99
  tau: 0.005
  policy_delay: 1
  actor_lr: 2.0e-4
  residual_actor_lr: 8.0e-5
  critic_lr: 3.0e-4
  target_noise: 0.2
  noise_clip: 0.5
  q_clip: 200.0
  q_clip_high: 50.0
  high_reward_normalize: true
  high_buffer_size: 30000
  low_buffer_size: 120000
  high_batch_size: 64
  low_batch_size: 128
  learning_starts_low: 512
  learning_starts_high: 64
  gradient_steps_low: 2
  gradient_steps_high: 4
  goal_relabel: true
  goal_relabel_mode: her_mix
  relabel_p_orig: 0.35
  relabel_p_ach: 0.45
  relabel_candidates: 8
  market_goal_prior: true
  market_prior_weight: 0.55
  market_prior_weight_end: 0.12
  market_prior_anneal_start: 0.22
  market_prior_strength: 0.15
  charge_threshold: 0.40
  discharge_threshold: 0.90
  recovery_goal_horizon_steps: 56
  recovery_prior_weight: 0.98
  phase_a_steps: 0
  goal_dropout: 0.0
  actor_bc_weight: 0.16
  obs_norm: true
  obs_scale: 1.0e6
  log_every: 500
  price_aware_bootstrap: true
  bc_pretrain: true
  bc_pretrain_low: false
  bc_pretrain_high: true
  bc_windows: 4
  bc_epochs_low: 20
  bc_epochs_high: 25
  use_shadow: false

soc_keys:
  - battery_soc
  - caes_gas_soc
