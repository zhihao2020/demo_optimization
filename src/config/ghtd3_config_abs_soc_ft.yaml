# abs 主线 + 高层 λ-SoC 微调（修夏 SoC）
# 从 ghtd3_abs_s2 续训：加强 recovery prior 与 high_lambda_soc

ghtd3:
  enabled: true
  subgoal_interval: 8
  goal_dim: 5
  goal_low:  [-0.30, -0.12, -0.10, -0.20, 0.0]
  goal_high: [ 0.30,  0.12,  0.10,  0.20, 1.0]
  intrinsic_weights: [1.5, 1.2, 0.25, 0.4]
  intrinsic_alpha: 0.40
  intrinsic_alpha_end: 0.18
  hybrid_anchor: false
  hybrid_anchor_path: null
  hybrid_init_low: false
  execution_mode: goal_conditioned
  residual_init: false
  goal_input_scale: 4.0
  low_use_raw_obs: false
  obs_norm: true
  obs_scale: 1.0e6
  mle_pretrain_residual: false
  f_mle_pretrain: false
  high_explore_noise: 0.03
  low_explore_noise: 0.04
  epsilon_start: 0.12
  epsilon_end: 0.03
  gamma: 0.99
  tau: 0.005
  policy_delay: 1
  actor_lr: 1.5e-4
  critic_lr: 2.5e-4
  target_noise: 0.2
  noise_clip: 0.5
  q_clip: 200.0
  q_clip_high: 50.0
  high_reward_normalize: true
  high_buffer_size: 30000
  low_buffer_size: 120000
  high_batch_size: 64
  low_batch_size: 128
  learning_starts_low: 256
  learning_starts_high: 32
  gradient_steps_low: 2
  gradient_steps_high: 4
  goal_relabel: true
  goal_relabel_mode: ms_her
  ms_her_weighting: true
  ms_her_p_mkt: 0.10
  relabel_p_orig: 0.30
  relabel_p_ach: 0.35
  market_goal_prior: true
  market_prior_weight: 0.35
  market_prior_weight_end: 0.15
  market_prior_anneal_start: 0.20
  market_prior_strength: 0.16
  charge_threshold: 0.40
  discharge_threshold: 0.90
  # 加强回收
  recovery_goal_horizon_steps: 48
  recovery_prior_weight: 0.98
  phase_a_steps: 0
  actor_bc_weight: 0.15
  log_every: 500
  price_aware_bootstrap: true
  bc_pretrain: false
  # λ-SoC 高层
  high_lambda_soc: true
  ltar_lambda_init: 0.8
  ltar_lambda_lr: 0.20
  ltar_lambda_max: 10.0
  ltar_cost_tol: 0.0
  tea_terminal_soc_penalty: 0.8
  tariff_aligned_c: false
  use_shadow: false

soc_keys:
  - battery_soc
  - caes_gas_soc
