# FeasibilityOracle 方向感知裕度（来自方程 + residual P99 + failure 审计）。
# 禁止统一 0.02 盲目扩张；各设备/模式/方向独立配置。
# residual = actual - predicted；dangerous 方向上的 P99 转化为保守裕度。

oracle_version: "d5.7-0903-charge-headroom"

# 裕度：0903 开环 + 2000 有效步。通信步 3600=10×内部 360 s，模式切换第一小时
# 有 1/10 旧斜率滞后；残差按开环物理尾巴写入，不用随机策略 P99 丢掉冷天 idle。
battery:
  # 充电 eta_charge=1.0（无损）；放电 /eta=0.85。第一小时残差来自 360 s 斜率滞后，不是 E_cap 错。
  # 0903 给 Battery 加了 noEvent 后，该滞后仍在（欧拉混斜率，不是 if 支路延迟）。
  residual_p99_charge_high: 0.020
  residual_p99_discharge_low: 0.044
  margin_charge_high: 0.010
  margin_discharge_low: 0.012
  source: "0903_open_loop: charge_lag=0.020 discharge_switch_lag=0.0435"

thermal:
  # 必须用上一时刻 ACTUAL p_thermal，而非请求动作
  use_actual_previous_p_thermal: true
  residual_p99_ramp: 0.0
  margin_u: 0.0
  source: "python_rate_max_from_actual_p_thermal"

caes:
  # 模式专用：气/热/冷 SOC + 压力 + 温度联合约束，禁止仅看 gas SOC
  discharge:
    residual_p99_gas_low: 0.024
    residual_p99_hot_low: 0.003
    residual_p99_cold_high: 0.002
    residual_p99_cold_low: 0.004
    residual_p99_pressure_low: 2.4e5
    # 充电切放电：360 s 欧拉仍带着充电斜率，气罐 T 继续抬压。
    # Stage C 两条 false-safe：p=9.48 MPa、u=-0.33，预测降到 9.39，实测升到 9.51。
    residual_p99_pressure_high: 1.2e5
    residual_p99_temp_abs: 3.4
    margin_gas: 0.015
    margin_hot: 0.015
    margin_cold: 0.015
    margin_pressure_Pa: 1.0e5
    margin_temp_K: 4.0
  idle:
    # 冷/热：质量流=0，只剩 360 s 滞后（开环 0.0009，P99≈0.0014）。
    # 气罐 SOC=p/p_norm（不是质量）。idle 无质量流，但壁面换热使 T、p 跟 T_env。
    # 0903 开环仍是：T_env=262.4 第一小时 ΔSOC_gas=−0.0237；T_env=301.05 为 +0.0265。
    # 随机 2000 步 idle |ΔSOC| P99≈0.013，不能用它丢掉冷天第一小时尾巴。
    residual_p99_gas: 0.027
    residual_p99_hot: 0.0014
    residual_p99_cold: 0.0014
    residual_p99_pressure: 2.7e5
    # 高压侧不能用 270 kPa 冷天 idle 尾巴：否则 9.11–9.50 MPa 只剩放电，
    # 充电切放电会把压力顶过 9.50。高压侧只用 ~30 kPa（实测过冲 24 kPa）。
    residual_p99_pressure_high: 3.0e4
    # 气罐 ΔT≈8.7 K 已由 SOC=p/p_norm 的 gas/pressure 残差覆盖。
    # 冷罐初值 T≈313 K、上限 320 K，若把 8.8 K 套到冷罐会在开机状态禁止 idle。
    residual_p99_temp_abs: 2.8
    margin_gas: 0.01
    margin_hot: 0.005
    margin_cold: 0.005
    margin_pressure_Pa: 1.2e5
    margin_temp_K: 3.0
  charge:
    residual_p99_gas_high: 0.008
    residual_p99_hot_high: 0.001
    residual_p99_cold_low: 0.002
    residual_p99_cold_high: 0.002
    residual_p99_pressure_high: 1.2e5
    # 停充点 = 9.50 − idle高压envelope(0.39) − 一步充电Δp(0.22) ≈ 8.89 MPa。
    # d5.6 放宽 idle 高压后 943 次待机顶压；d5.5 两条是充→放顶压。都是冲进 9.11–9.50 死区。
    headroom_to_idle_envelope_Pa: 2.2e5
    residual_p99_temp_abs: 4.5
    margin_gas: 0.015
    margin_hot: 0.015
    margin_cold: 0.015
    margin_pressure_Pa: 1.0e5
    margin_temp_K: 4.0
  energy_model:
    # energy = u_caes * P_cap * dt / E_ref；d_soc_i = alpha_i * energy
    # 2026-09-01 在 0903 FMU 上 2000 有效步过原点 OLS（充 706 / 放 708）。
    # 冷罐与热罐精确反号；R^2 热/冷 0.99、气 0.95。
    E_ref_J: 5.4e12
    charge:
      alpha_gas: 0.191
      alpha_hot: 0.091
      alpha_cold: -0.091
    discharge:
      alpha_gas: 0.274
      alpha_hot: 0.131
      alpha_cold: -0.131
    alpha_gas: 0.220
    alpha_hot: 0.105
    alpha_cold: -0.105
    alpha_pressure_Pa_per_soc: 1.0e7
    alpha_temp_K_per_u: 2.0
  source: "0903_open_loop+2000steps_2026-09-01; gas_SOC=p/p_norm T_env; 360s_lag"

grid:
  residual_p99_W: 8.6e7
  margin_W: 2.0e5
  source: "0903_open_loop idle plant vs predict_p_grid; |resid| 64–86 MW"

safety_classifier:
  model_version: "d5.1-logistic"
  default_threshold: 0.99
  thresholds: [0.99, 0.995, 0.999]
  gate_metric: false_safe_rate
  max_false_safe_rate: 0.01

phase_e_gates:
  zero_known_post_step_hard_violations: true
  boundary_stress_min_actions: 20000
  boundary_stress_require_pass: true
  safety_classifier_max_false_safe_rate: 0.01
  formal_default_blocked: false
