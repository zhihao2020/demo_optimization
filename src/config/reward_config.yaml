# 默认：FMU economic_cashflow_* 差分。market.available=true 时电网项改由分时电价 Python 结算替换。
# CAES/电池设备现金流默认从 J 中扣除（母线 Electrical.C 为 flow，0.2/0.4 记账符号相反且与 TOU 重复）。
economic_source: Modelica_FMU_plus_optional_market_grid
exclude_storage_device_cash: true
cost_reference:
  value: 156539.83544146415
  unit: CNY_per_step
  source: rule_controller_seasonal_p95
  computed_at: '2026-07-14'
  trajectory: scripts/calibrate_reward_seasonal.py
  n_samples: 1008
  mean_week_raw_cost: 12345799.377755053
  previous_value: 96199.12664345714
terminal_soc:
  enabled: true
  period_hours: 168
  mode: binary_bonus
  bonus: 15.0
  # 对齐崔文式 (29)：过门给固定加分，不过门为 0，不再按 L1 重罚
  fail_penalty_l1: 0.0
  tolerance: 0.06
  quadratic_weight: 1.0
  # 能量库存：电池 + 气库；热/冷罐见 full L1 诊断
  primary_keys:
    - battery_soc
    - caes_gas_soc
  use_full_l1_for_pass: false
  weights:
    # 对齐崔文：电池与气库等权绝对值之和
    battery_soc: 1.0
    caes_gas_soc: 1.0
    caes_hot_soc: 0.35
    caes_cold_soc: 0.35
  require_complete_episode: true
  require_no_failure: true
  tolerance_strict: 0.041607738312361975
  tolerance_loose: 0.1
  shaping:
    enabled: true
    mode: potential
    coef: 5.0
    absolute_coef: 0.08
    # 年末硬门回收窗（相对 episode 末）；周 episode 时即周末尾
    recovery_horizon_steps: 40
    recovery_coef_scale: 5.0
    recovery_absolute_scale: 4.0
    # 连续年：每个日历周末软锚（不触发 terminal bonus，只抬高 shaping）
    weekend_soft_anchor: true
    weekend_horizon_steps: 24
    weekend_coef_scale: 2.0
    weekend_absolute_scale: 2.0
gamma: 0.99
episode_steps: 168
# Scheme B (Python = authoritative economic layer):
# ΔJ_gen = ΔJ_cash − C^carbon − C^CUT − C^deg − C^su − C^grid
# ΔJ_cash = FMU Δ − grid FMU + TOU − CAES/battery device cash (keep thermal/load/wind/pv).
# FMU: physics + remaining device cash. TOU grid / carbon / CUT / deg / su settled here.
# Parameter evidence: docs/parameter_evidence.md
# Active profile for new eval/train. Archived runs keep their copied YAML.
parameter_profile_id: official-2024-ets-sd-grid-v1
parameter_profile_note: >
  Main carbon book uses 2024 YE CEA close 97.49 CNY/t, MEE 2024 Class-II coal
  benchmark 0.8049 t/MWh, and 2023 Shandong grid EF 0.6191 t/MWh. Legacy runs
  under runs/**/config are tagged legacy-2022-grid-factor/proxy-benchmark.
carbon:
  enabled: true
  # flat_tax: 逐步 π·Δm（旧行为；单元测试默认）
  # intensity_benchmark: 火电按强度基准累积配额，年末买卖结算；外购电仍逐步计税
  mode: intensity_benchmark
  price_cny_per_t: 97.49
  price_source: "MEE National ETS 2024 year-end composite closing price 97.49 CNY/tCO2e"
  price_note: "2024 band 69–106; peak 105.65; legacy OP 80; GHTD3 lit cross-check ~86.4"
  sensitivity_cny_per_t: [69.30, 80.0, 86.4, 97.49, 105.65]
  eta_thermal_t_per_mwh: 0.85
  eta_grid_t_per_mwh: 0.6191
  # 150 MW → 官方「300 MW 等级及以下常规燃煤」2024 发电基准值
  beta_t_per_mwh: 0.8049
  beta_source: "MEE 2023/2024 power-sector CEA allocation; Class II generation benchmark 2024"
  settle_at_episode_end: true
  # 头寸归一化尺度 [t]：观测用 tanh(Q / q_scale)
  q_norm_scale_t: 1.0e5
  eta_thermal_source: "plant direct-emission scenario proxy 0.85 t/MWh (not the allowance benchmark)"
  eta_grid_source: "MEE/NBS 2023 Shandong location-based electricity CO2 factor 0.6191 t/MWh"
  thermal_power_key: p_thermal
  grid_power_key: p_grid
  count_grid_import_only: true
  # 外购电间接排放：不进配额，仍按 flat 逐步计税
  grid_in_quota: false
  double_count_note: "external_ETS_cost_not_fuel_rescaling; beta≠eta_thermal"
curtailment:
  enabled: true
  nu_curt_cny_per_mwh: 300.0
  nu_uns_cny_per_mwh: 1000.0
  curtail_power_key: p_curtailment
  unserved_power_key: p_unserved
  note: "Objective penalties; GHTD3 ν_res=0.041 USD/kWh≈295 CNY/MWh cross-check; not a regulated tariff"
# Story A: contracted interchange in J (FMU hard cap stays ±500 MW; those
# parameters are compiled into the FMU and are not settable). Excess |P_grid|
# beyond ±200 MW is priced so 150 MW CAES blocks become first-order vs battery.
grid_contract:
  enabled: true
  p_lim_w: 2.0e8
  nu_cny_per_mwh: 600.0
  grid_power_key: p_grid
  note: "scenario soft ±200 MW band + 600 CNY/MWh; not a statutory fee; FMU P1/P2 unchanged"
# Learning-only Cui 2024 Eq. (35) R^F. Not added to J^gen / linprog cash.
# ω1=RR (BESS only) when |P^disp|<θ; ω2/ω3=LEB/SA (CAES on) when |P^disp|≥θ.
storage_use:
  enabled: true
  grid_power_key: p_grid
  caes_power_key: p_caes
  battery_power_key: p_battery
  theta_w: 5.0e7          # 50 MW; half of 100 MW battery rating, ~CAES min charge
  rf_coef: 0.5            # Cui 2024 Eq. (35) mix weight; learning-only, not J^gen
  active_w: 1.0e6         # |P|≥1 MW counts as on
  note: "r^ext only; indicator R^F, not a caes_active bonus on small deviations"
battery_degradation:
  enabled: true
  # Cui-style convex cumulative discharge: ψ(δ)=a0·δ^p, C_t=ψ(δ_t)-ψ(δ_{t-1})
  # δ = cumulative discharge energy [MWh]. Discharge only (not charge).
  mode: convex_cumulative  # or linear_throughput (legacy)
  power_exp: 2.03
  # Plant battery energy capacity [MWh] (twin default ~400 MWh)
  e_cap_mwh: 400.0
  # Lifetime economics for a0 calibration: ψ(E_life)=Capex_total
  # Capex_total = capex_cny_per_kwh * e_cap_mwh * 1000
  # E_life = n_cycles * dod_eq * e_cap_mwh
  # a0 = Capex_total / E_life^power_exp
  capex_cny_per_kwh: 1000.0
  n_cycles: 5000.0
  dod_eq: 0.8
  # 连续年 / 长 episode：从 δ=0 累积。短周若需非零边际成本可改回 0.25。
  offset_frac_of_life: 0.0
  # Optional hard override of a0 [CNY / (MWh)^p]:
  # a0: null
  battery_power_key: p_battery
  # Sign: discharge contributes when p_battery < 0 (Python academic / export convention)
  discharge_negative_power: true
  note: "Cui D_BESS ψ(δ)=a0 δ^2.03; annual cumulative δ; offset=0 for year episodes"
caes_startup:
  enabled: true
  # Cui et al., Appl. Energy 374 (2024) 123950, Table 2: c_su=3.42 USD / switch
  # at P_com=P_tur=800 kW. Linear scale to this plant's P_cap is an EXTRAPOLATION
  # (source case does not authorise capacity scaling); sensitivity: none / linear / sqrt.
  # FX: World Bank 2024 average ~7.2 CNY/USD.
  c_su_usd_ref: 3.42
  p_ref_w: 8.0e5
  usd_cny: 7.2
  p_cap_w: 1.5e8
  scale_mode: none
  caes_power_key: p_caes
  note: "Cui 2024 Table 2 c_su=3.42 USD at 800 kW; linear P_cap/P_ref is scenario extrapolation"
parameter_status: 'official-2024-ets-sd-grid-v1 + R^F=0.5 Eq.35 + exclude storage device cash 2026-08-30'
