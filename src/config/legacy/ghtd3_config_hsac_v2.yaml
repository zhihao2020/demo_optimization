# Hierarchical-SAC v2 (low SAC + weak MSGP + MS-HER + rejection learning)
# vs hsac v1: learn_from_reject, weaker prior, milder track, min_span, no u_tp floor

ghtd3:
  enabled: true
  subgoal_interval: 8
  goal_dim: 5
  goal_low:  [-0.30, -0.12, -0.10, -0.20, 0.0]
  goal_high: [ 0.30,  0.12,  0.10,  0.20, 1.0]
  intrinsic_weights: [1.0, 0.9, 0.12, 0.18]
  intrinsic_alpha: 0.25
  intrinsic_alpha_end: 0.08
  hybrid_anchor: false
  hybrid_anchor_path: null
  hybrid_init_low: false
  execution_mode: goal_conditioned
  residual_init: false
  goal_input_scale: 4.0
  low_use_raw_obs: false
  obs_norm: true
  obs_scale: 1.0e6
  mle_pretrain_residual: false
  mle_fit_mode: false
  low_level_algo: sac
  low_target_entropy: -4.1
  low_alpha_lr: 3.0e-4
  low_alpha_max: 1.0
  actor_bc_weight: 0.0
  f_mle_pretrain: true
  f_mle_low: true
  f_mle_high: true
  f_mle_windows: 4
  f_mle_epochs_low: 18
  f_mle_epochs_high: 18
  high_explore_noise: 0.04
  low_explore_noise: 0.0
  epsilon_start: 0.20
  epsilon_end: 0.05
  gamma: 0.99
  tau: 0.005
  policy_delay: 1
  actor_lr: 2.0e-4
  critic_lr: 3.0e-4
  target_noise: 0.2
  noise_clip: 0.5
  q_clip: 200.0
  q_clip_high: 80.0
  clamp_high_actor_q: false
  high_reward_normalize: true
  min_span_tp: 0.02
  min_span_bat: 0.05
  learn_from_reject: true
  reject_reward_scale: 1.0
  reject_store_prob: 1.0
  reject_max_store_per_step: 8
  learn_from_invalid_step: false
  relax_thermal_floor: true
  high_buffer_size: 30000
  low_buffer_size: 180000
  high_batch_size: 64
  low_batch_size: 128
  learning_starts_low: 512
  learning_starts_high: 64
  gradient_steps_low: 2
  gradient_steps_high: 3
  goal_relabel: true
  goal_relabel_mode: ms_her
  ms_her_weighting: true
  ms_her_p_mkt: 0.05
  ms_her_min_weight: 0.35
  ms_her_max_weight: 1.5
  relabel_p_orig: 0.35
  relabel_p_ach: 0.35
  relabel_candidates: 8
  market_goal_prior: true
  market_prior_weight: 0.12
  market_prior_weight_end: 0.02
  market_prior_anneal_start: 0.10
  market_prior_strength: 0.09
  charge_threshold: 0.40
  discharge_threshold: 0.90
  recovery_goal_horizon_steps: 40
  recovery_prior_weight: 0.40
  phase_a_steps: 1500
  goal_dropout: 0.0
  log_every: 500
  price_aware_bootstrap: true
  bc_pretrain: true
  bc_pretrain_low: true
  bc_pretrain_high: true
  bc_windows: 4
  bc_epochs_low: 18
  bc_epochs_high: 18
  high_lambda_soc: false
  tariff_aligned_c: false
  use_shadow: false

soc_keys:
  - battery_soc
  - caes_gas_soc
