fmu:
  path: data/TypicalScensrio_Example_TypicalScene_PowerSystem_8760h.fmu
  communication_step_seconds: 3600
  decision_interval_seconds: 3600
  episode_steps: 168
  start_time_seconds: 0
  # 正式训练按 168 h 周 episode 覆盖该 FMU 的全年时间轴；尾段由最后一个窗口覆盖。
  annual_horizon_hours: 8760

# 仅供策略使用的日前时序观测；FMU 仍使用其内嵌的同源表作为物理边界与真值。
# 每小时特征顺序：wind, irradiance, ambient_temperature, planned_load。
# mode=perfect：CSV 完美前瞻（主表默认）
# mode=noisy：乘性噪声日前（仅污染 obs）
# mode=predicted：residual BiLSTM 导出序列（data/resource_predicted/）
forecast:
  enabled: true
  mode: perfect
  horizon_hours: 24
  noise:
    seed: 0
    # 乘性相对误差标准差；温度默认 0（避免无量纲温偏被误乘）
    sigma:
      wind: 0.10
      irradiance: 0.10
      ambient_temperature: 0.0
      planned_load: 0.08
    lag_hours: 0
  sources:
    - {name: wind, path: data/winds.csv, offset: 0.0, scale: 15.0}
    - {name: irradiance, path: data/Gstc.csv, offset: 0.0, scale: 1000.0}
    - {name: ambient_temperature, path: data/environment.csv, offset: 273.15, scale: 40.0}
    - {name: planned_load, path: data/load.csv, offset: 0.0, scale: 3.0e8}
  # mode=predicted 时使用（与 sources 同 offset/scale，value 为物理单位）
  predicted_sources:
    - {name: wind, path: data/resource_predicted/winds.csv, offset: 0.0, scale: 15.0}
    - {name: irradiance, path: data/resource_predicted/Gstc.csv, offset: 0.0, scale: 1000.0}
    - {name: ambient_temperature, path: data/resource_predicted/environment.csv, offset: 273.15, scale: 40.0}
    - {name: planned_load, path: data/resource_predicted/load.csv, offset: 0.0, scale: 3.0e8}

# Story A lock-CAES counterfactual: force idle (u_caes=0), charge/discharge mask off.
# Override with env OPTIMAL_DEMO_LOCK_CAES=1 without editing this file.
caes:
  locked: false

# FMU modelDescription 没有为 input 给出 min/max；以下边界来自同一实例的 Modelica 参数和设备启机约束。
# 三个值均为 FMU 原生无量纲调度指令，绝非 Python 侧的归一化或 W 到标幺的转换。
actions:
  - name: u_tp
    fmu_variable: u_tp
    unit: "1"
    min: 0.3333333333333333
    max: 1.0
    bound_source: "resources/Example/TypicalScene/PowerSystem_8760h.mo: thermal P_min=50MW, P_cap=150MW"
  - name: u_battery
    fmu_variable: u_battery
    unit: "1"
    min: -1.0
    max: 1.0
    bound_source: "docs/fmu_input_bounds.md: battery nominal dispatch range"
  - name: u_caes
    fmu_variable: u_caes
    unit: "1"
    min: -1.0
    max: 1.0
    valid_intervals: [[-1.0, -0.33], [0.0, 0.0], [0.86, 1.0]]
    bound_source: "docs/fmu_input_bounds.md: CAES min-start constraints; non-convex legal set"

# 列表即固定观测顺序；功率/热力状态没有 FMU 硬边界时明确使用无穷边界。
observations:
  - {name: battery_soc, unit: "1", low: 0.0, high: 1.0}
  - {name: caes_gas_soc, unit: "1", low: 0.0, high: 1.0}
  - {name: caes_hot_soc, unit: "1", low: 0.0, high: 1.0}
  - {name: caes_cold_soc, unit: "1", low: 0.0, high: 1.0}
  - {name: caes_gas_pressure, unit: Pa, low: 0.0}
  - {name: caes_gas_temperature, unit: K, low: 0.0}
  - {name: caes_hot_temperature, unit: K, low: 0.0}
  - {name: caes_cold_temperature, unit: K, low: 0.0}
  - {name: p_thermal, unit: W}
  - {name: p_battery, unit: W}
  - {name: p_caes, unit: W}
  - {name: p_grid, unit: W}
  - {name: p_wind_available, unit: W}
  - {name: p_wind_actual, unit: W}
  - {name: p_pv_available, unit: W}
  - {name: p_pv_actual, unit: W}
  - {name: p_load_actual, unit: W}
  - {name: p_curtailment, unit: W, low: 0.0}
  - {name: p_unserved, unit: W, low: 0.0}

# 经济量不进入 observation；只用于 Python 的 reward、审计与年度评估。
# 全部是 Modelica 内部现金流的累计值，单位 CNY，正=收益、负=成本。
economics:
  - {name: economic_cashflow_total, unit: CNY}
  - {name: economic_cashflow_wind, unit: CNY}
  - {name: economic_cashflow_pv, unit: CNY}
  - {name: economic_cashflow_thermal, unit: CNY}
  - {name: economic_cashflow_battery, unit: CNY}
  - {name: economic_cashflow_caes, unit: CNY}
  - {name: economic_cashflow_load, unit: CNY}
  - {name: economic_cashflow_grid, unit: CNY}

# price-taker 分时电价：observation 可用预测价；reward 结算始终用 price_path（实现价）。
market:
  available: true
  # 结算/实现价：默认山东分时表；有残差实验时改为 data/price_realized.csv
  price_path: data/price_tou.csv
  # 观测用价（可选）：BiLSTM 导出 data/price_predicted.csv；默认与结算相同
  obs_price_path: null
  horizon_hours: 24
  buy_scale_yuan_per_kwh: 1.2
  sell_scale_yuan_per_kwh: 0.3
  # 气库末段可扭回初值。电池对齐崔文：不劫持充放，只靠软奖励。
  soc_recovery_horizon: 40
  soc_recovery_battery_horizon: 0
  note: "山东工商业代理购电分时+110kV输配电度价算例；obs可接预测价，结算用实现价；气库末段回收、电池不强制扭回；不做电网出清。"
