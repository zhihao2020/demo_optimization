# 消融：无 MSGP（关市场 prior）
# 基于 abs 主线

ghtd3:
  enabled: true
  subgoal_interval: 8
  goal_dim: 5
  goal_low:  [-0.30, -0.12, -0.10, -0.20, 0.0]
  goal_high: [ 0.30,  0.12,  0.10,  0.20, 1.0]
  intrinsic_weights: [1.5, 1.2, 0.25, 0.4]
  intrinsic_alpha: 0.50
  intrinsic_alpha_end: 0.22
  hybrid_anchor: false
  hybrid_anchor_path: null
  hybrid_init_low: false
  execution_mode: goal_conditioned
  residual_init: false
  goal_input_scale: 4.0
  low_use_raw_obs: false
  obs_norm: true
  obs_scale: 1.0e6
  mle_pretrain_residual: false
  f_mle_pretrain: true
  f_mle_low: true
  f_mle_high: true
  f_mle_windows: 4
  f_mle_epochs_low: 25
  f_mle_epochs_high: 25
  high_explore_noise: 0.05
  low_explore_noise: 0.06
  epsilon_start: 0.25
  epsilon_end: 0.05
  gamma: 0.99
  tau: 0.005
  policy_delay: 1
  actor_lr: 2.0e-4
  critic_lr: 3.0e-4
  target_noise: 0.2
  noise_clip: 0.5
  q_clip: 200.0
  q_clip_high: 50.0
  high_reward_normalize: true
  high_buffer_size: 30000
  low_buffer_size: 120000
  high_batch_size: 64
  low_batch_size: 128
  learning_starts_low: 512
  learning_starts_high: 64
  gradient_steps_low: 2
  gradient_steps_high: 4
  goal_relabel: true
  goal_relabel_mode: ms_her
  ms_her_weighting: true
  relabel_p_orig: 0.35
  relabel_p_ach: 0.35
  market_goal_prior: false
  market_prior_weight: 0.0
  market_prior_weight_end: 0.0
  recovery_goal_horizon_steps: 40
  recovery_prior_weight: 0.0
  phase_a_steps: 2000
  actor_bc_weight: 0.20
  log_every: 500
  price_aware_bootstrap: true
  bc_pretrain: true
  high_lambda_soc: false
  use_shadow: false

soc_keys:
  - battery_soc
  - caes_gas_soc
