# STFR Stage A：Safe Two-timescale Feasible Residual
# 原理：慢层库存/市场 prior（不学高层）+ 快层教师信任域残差 + mode 锁 + GiveSafe
# 详见 docs/STFR_TRAP_formulation.md

ghtd3:
  enabled: true
  stfr_enabled: true
  # Stage A：高层不训练，goal 仅 prior
  high_level_mode: prior_only
  # 慢周期 H（小时）
  subgoal_interval: 24
  goal_dim: 5
  goal_low:  [-0.30, -0.12, -0.10, -0.20, 0.0]
  goal_high: [ 0.30,  0.12,  0.10,  0.20, 1.0]
  # 内在奖励仍用 5 维结构；prior 主导 bat/gas/arb
  intrinsic_weights: [1.5, 1.2, 0.15, 0.25]
  intrinsic_alpha: 0.35
  intrinsic_alpha_end: 0.18
  hybrid_anchor: true
  hybrid_anchor_path: runs/market_bc_rl_60k_20260803/checkpoints/hybrid_givesafe_td3.pt
  hybrid_init_low: false
  execution_mode: action_residual
  tea_expandable: false
  residual_init: true
  # 信任域上界 \(\bar\beta\)（固定，不课程放大）
  residual_beta_tp: 0.12
  residual_beta_bat: 0.28
  residual_beta_mag: 0.06
  residual_mode_margin: 1.5
  residual_mode_override: false
  residual_logit_clip: 8.0
  residual_beta_from_arb: true
  residual_beta_price_gate: true
  residual_price_gate_thr: 0.70
  residual_price_gate_boost: 1.15
  goal_input_scale: 4.0
  residual_alpha0: 0.0
  residual_alpha_max: 0.20
  residual_train_start: 0
  obs_norm_high_only: false
  low_use_raw_obs: false
  mle_pretrain_residual: true
  mle_fit_mode: false
  mle_epochs: 25
  mle_windows: 4
  high_explore_noise: 0.0
  low_explore_noise: 0.03
  epsilon_start: 0.0
  epsilon_end: 0.0
  gamma: 0.99
  tau: 0.005
  policy_delay: 1
  actor_lr: 2.0e-4
  residual_actor_lr: 1.0e-4
  critic_lr: 3.0e-4
  target_noise: 0.2
  noise_clip: 0.5
  q_clip: 200.0
  q_clip_high: 50.0
  high_reward_normalize: true
  high_buffer_size: 10000
  low_buffer_size: 120000
  high_batch_size: 64
  low_batch_size: 128
  learning_starts_low: 512
  learning_starts_high: 64
  gradient_steps_low: 2
  gradient_steps_high: 0
  goal_relabel: false
  goal_relabel_mode: her_mix
  relabel_p_orig: 0.40
  relabel_p_ach: 0.40
  relabel_candidates: 8
  market_goal_prior: true
  market_prior_weight: 1.0
  market_prior_weight_end: 1.0
  market_prior_anneal_start: 1.0
  market_prior_strength: 0.14
  charge_threshold: 0.40
  discharge_threshold: 0.90
  recovery_goal_horizon_steps: 48
  recovery_prior_weight: 0.98
  phase_a_steps: 0
  goal_dropout: 0.0
  actor_bc_weight: 0.22
  obs_norm: true
  obs_scale: 1.0e6
  log_every: 500
  price_aware_bootstrap: true
  bc_pretrain: true
  bc_pretrain_low: false
  bc_pretrain_high: false
  bc_windows: 4
  bc_epochs_low: 20
  bc_epochs_high: 25
  use_shadow: false

soc_keys:
  - battery_soc
  - caes_gas_soc
