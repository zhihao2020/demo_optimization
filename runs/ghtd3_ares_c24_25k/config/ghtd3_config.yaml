# Safe Market-GHTD3：Modelica 对齐 5 维 goal + 动作空间残差底层
# goal = [Δbat, Δgas, Δth_mean, u_tp_bias, arb]
# 执行：a = clip(a_H(s) + β·tanh(Δ(s_norm,g)))  —— 避免 raw 绝对头饱和导致 goal 死通路

ghtd3:
  enabled: true
  subgoal_interval: 24
  # --- Modelica-aligned 5D goal ---
  goal_dim: 5
  goal_low:  [-0.30, -0.12, -0.10, -0.20, 0.0]
  goal_high: [ 0.30,  0.12,  0.10,  0.20, 1.0]
  intrinsic_weights: [1.5, 1.2, 0.25, 0.4]  # bat, gas, th, u_tp
  # 内在奖励调度
  intrinsic_alpha: 0.45
  intrinsic_alpha_end: 0.20
  # Hybrid 锚定：冻结 a_H；底层只学动作残差（禁止绝对头移植）
  hybrid_anchor: true
  hybrid_anchor_path: runs/market_bc_rl_60k_20260803/checkpoints/hybrid_givesafe_td3.pt
  hybrid_init_low: false
  execution_mode: action_residual   # action_residual | goal_conditioned | blend
  residual_init: true
  residual_beta_tp: 0.15
  residual_beta_bat: 0.30
  residual_beta_mag: 0.20
  residual_mode_margin: 1.5
  residual_mode_override: false   # 模式锁定 Hybrid，只改连续量（防 CAES 炸）
  residual_logit_clip: 8.0
  residual_beta_from_arb: true
  # 价差门控：高买电价时放大 β_bat（默认关；c=24 / 敏感实验可开）
  residual_beta_price_gate: true
  residual_price_gate_thr: 0.70
  residual_price_gate_boost: 1.35
  goal_input_scale: 4.0
  residual_alpha0: 0.0
  residual_alpha_max: 0.28
  residual_train_start: 0
  # 残差 actor 用 obs_norm；Hybrid a_H 仍 raw
  obs_norm_high_only: false
  low_use_raw_obs: false
  mle_pretrain_residual: true
  mle_fit_mode: false
  mle_epochs: 25
  mle_windows: 4
  # 探索
  high_explore_noise: 0.04
  low_explore_noise: 0.03
  epsilon_start: 0.20
  epsilon_end: 0.05
  # TD3 + SMDP γ^c
  gamma: 0.99
  tau: 0.005
  policy_delay: 1
  actor_lr: 2.0e-4
  residual_actor_lr: 1.0e-4
  critic_lr: 3.0e-4
  target_noise: 0.2
  noise_clip: 0.5
  reward_clip: [-25.0, 25.0]
  q_clip: 200.0
  q_clip_high: 50.0
  high_reward_normalize: true
  # buffer
  high_buffer_size: 30000
  low_buffer_size: 120000
  high_batch_size: 64
  low_batch_size: 128
  learning_starts_low: 512
  learning_starts_high: 64
  gradient_steps_low: 2
  gradient_steps_high: 4
  # HER-mix
  goal_relabel: true
  goal_relabel_mode: her_mix
  relabel_p_orig: 0.40
  relabel_p_ach: 0.40
  relabel_candidates: 8
  # 市场 prior + 退火
  market_goal_prior: true
  market_prior_weight: 0.55
  market_prior_weight_end: 0.12
  market_prior_anneal_start: 0.25
  market_prior_strength: 0.14
  charge_threshold: 0.40
  discharge_threshold: 0.90
  recovery_goal_horizon_steps: 40
  recovery_prior_weight: 0.95
  # 课程：phase_a = 强 prior + 可选冻 hi 学 low；hybrid 模式下 residual 另用 residual_train_start
  phase_a_steps: 0
  goal_dropout: 0.0
  actor_bc_weight: 0.25
  obs_norm: true
  obs_scale: 1.0e6
  log_every: 500
  price_aware_bootstrap: true
  # 残差路径：low 用 MLE 预热，不做绝对头 BC；high 仍 BC
  bc_pretrain: true
  bc_pretrain_low: false
  bc_pretrain_high: true
  bc_windows: 4
  bc_epochs_low: 20
  bc_epochs_high: 25
  use_shadow: false

soc_keys:
  - battery_soc
  - caes_gas_soc
