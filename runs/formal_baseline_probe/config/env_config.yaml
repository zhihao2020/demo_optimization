fmu:
  path: data/TypicalScensrio_Example_TypicalScene_PowerSystem_8760h.fmu
  communication_step_seconds: 3600
  decision_interval_seconds: 3600
  episode_steps: 168
  start_time_seconds: 0
  # 正式训练按 168 h 周 episode 覆盖该 FMU 的全年时间轴；尾段由最后一个窗口覆盖。
  annual_horizon_hours: 8760

# 仅供策略使用的已知日前时序；FMU 仍使用其内嵌的同源表作为物理边界。
# 每小时特征顺序：wind, irradiance, ambient_temperature, planned_load。
forecast:
  enabled: true
  horizon_hours: 24
  sources:
    - {name: wind, path: data/winds.csv, offset: 0.0, scale: 15.0}
    - {name: irradiance, path: data/Gstc.csv, offset: 0.0, scale: 1000.0}
    - {name: ambient_temperature, path: data/environment.csv, offset: 273.15, scale: 40.0}
    - {name: planned_load, path: data/load.csv, offset: 0.0, scale: 3.0e8}

# FMU modelDescription 没有为 input 给出 min/max；以下边界来自同一实例的 Modelica 参数和设备启机约束。
# 三个值均为 FMU 原生无量纲调度指令，绝非 Python 侧的归一化或 W 到标幺的转换。
actions:
  - name: u_tp
    fmu_variable: u_tp
    unit: "1"
    min: 0.3333333333333333
    max: 1.0
    bound_source: "resources/Example/TypicalScene/PowerSystem_8760h.mo: thermal P_min=50MW, P_cap=150MW"
  - name: u_battery
    fmu_variable: u_battery
    unit: "1"
    min: -1.0
    max: 1.0
    bound_source: "docs/fmu_input_bounds.md: battery nominal dispatch range"
  - name: u_caes
    fmu_variable: u_caes
    unit: "1"
    min: -1.0
    max: 1.0
    valid_intervals: [[-1.0, -0.33], [0.0, 0.0], [0.86, 1.0]]
    bound_source: "docs/fmu_input_bounds.md: CAES min-start constraints; non-convex legal set"

# 列表即固定观测顺序；功率/热力状态没有 FMU 硬边界时明确使用无穷边界。
observations:
  - {name: battery_soc, unit: "1", low: 0.0, high: 1.0}
  - {name: caes_gas_soc, unit: "1", low: 0.0, high: 1.0}
  - {name: caes_hot_soc, unit: "1", low: 0.0, high: 1.0}
  - {name: caes_cold_soc, unit: "1", low: 0.0, high: 1.0}
  - {name: caes_gas_pressure, unit: Pa, low: 0.0}
  - {name: caes_gas_temperature, unit: K, low: 0.0}
  - {name: caes_hot_temperature, unit: K, low: 0.0}
  - {name: caes_cold_temperature, unit: K, low: 0.0}
  - {name: p_thermal, unit: W}
  - {name: p_battery, unit: W}
  - {name: p_caes, unit: W}
  - {name: p_grid, unit: W}
  - {name: p_wind_available, unit: W}
  - {name: p_wind_actual, unit: W}
  - {name: p_pv_available, unit: W}
  - {name: p_pv_actual, unit: W}
  - {name: p_load_actual, unit: W}
  - {name: p_curtailment, unit: W, low: 0.0}
  - {name: p_unserved, unit: W, low: 0.0}

market:
  available: false
  buy_price_source: null
  sell_price_source: null
  note: "当前仓库没有可追溯市场价格时序；market_price 不加入 observation，禁止填充虚构 0。"
