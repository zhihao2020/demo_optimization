# GHTD3：论文 goal-conditioned hierarchical TD3 的本仓库适配配置
# 高层：每 c 步提出储能 SoC 增量目标；底层：条件于 goal 的混合动作 + GiveSafe

# Safe Market-GHTD3：对齐 Cui GHTD3 + 市场 prior + GiveSafe
# 增强：HER-mix 历史目标重放、prior 退火、两阶段高低层耦合、完整训练日志
ghtd3:
  enabled: true
  subgoal_interval: 8
  goal_dim: 2
  goal_low: [-0.25, -0.15]
  goal_high: [0.25, 0.15]
  # 内在奖励：前期重跟踪，后期偏经济
  intrinsic_alpha: 0.50
  intrinsic_alpha_end: 0.22
  # 探索
  high_explore_noise: 0.05
  low_explore_noise: 0.08
  epsilon_start: 0.25
  epsilon_end: 0.05
  # TD3 + SMDP γ^c
  gamma: 0.99
  tau: 0.005
  policy_delay: 1
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4

  target_noise: 0.2
  noise_clip: 0.5
  reward_clip: [-25.0, 25.0]
  q_clip: 200.0
  q_clip_high: 50.0
  high_reward_normalize: true
  # buffer
  high_buffer_size: 30000
  low_buffer_size: 120000
  high_batch_size: 64
  low_batch_size: 128
  learning_starts_low: 512
  learning_starts_high: 400
  gradient_steps_low: 2
  gradient_steps_high: 3
  # 历史目标重放 HER-mix（非平凡 legacy）
  goal_relabel: true
  goal_relabel_mode: her_mix   # her_mix | legacy | off
  relabel_p_orig: 0.40
  relabel_p_ach: 0.40
  # 剩余概率为 future achieved
  relabel_candidates: 8
  # 市场 prior + 训练期退火（后期让 μ^hi 超过固定峰谷规则）
  market_goal_prior: true
  market_prior_weight: 0.55
  market_prior_weight_end: 0.08
  market_prior_anneal_start: 0.20
  market_prior_strength: 0.16

  charge_threshold: 0.40
  discharge_threshold: 0.90
  recovery_goal_horizon_steps: 40
  recovery_prior_weight: 0.92
  # 两阶段耦合：先稳底层，再开高层更新
  phase_a_steps: 12000
  goal_dropout: 0.08
  log_every: 500
  price_aware_bootstrap: true
  bc_pretrain: true
  bc_windows: 4
  bc_epochs_low: 30
  bc_epochs_high: 20
  use_shadow: false

# observation 中 SoC 键（与 env_config observations 顺序一致）
soc_keys:
  - battery_soc
  - caes_gas_soc
