# 默认：FMU economic_cashflow_* 差分。market.available=true 时电网项改由分时电价 Python 结算替换。
economic_source: Modelica_FMU_plus_optional_market_grid
cost_reference:
  value: 156539.83544146415
  unit: CNY_per_step
  source: rule_controller_seasonal_p95
  computed_at: '2026-07-14'
  trajectory: scripts/calibrate_reward_seasonal.py
  n_samples: 1008
  mean_week_raw_cost: 12345799.377755053
  previous_value: 96199.12664345714
terminal_soc:
  enabled: true
  period_hours: 168
  mode: binary_bonus
  bonus: 11.830023338409209
  tolerance: 0.05
  quadratic_weight: 1.0
  weights:
    battery_soc: 1.0
    caes_gas_soc: 1.0
    caes_hot_soc: 1.0
    caes_cold_soc: 1.0
  require_complete_episode: true
  require_no_failure: true
  tolerance_strict: 0.041607738312361975
  tolerance_loose: 0.1
  # 过程 shaping（可叠加）：
  # - potential: 望远镜和 ≈ -coef * L1_final
  # - absolute: 每步 -absolute_coef * L1，滞留在错误 SOC 持续受罚
  # 市场环境下 absolute 过重会淹没套利：L1≈0.4 时 0.05*0.4*168≈-3.4
  shaping:
    enabled: true
    mode: potential
    coef: 4.0
    absolute_coef: 0.05
gamma: 0.99
episode_steps: 168
# Critic 数值稳定：裁剪进入 TD 更新的 reward（不影响 env 日志中的 raw 经济量）
reward_clip:
  enabled: true
  min: -20.0
  max: 20.0
parameter_status: 'audited: grid+thermal from Modelica; C_ref/terminal calibrated
  2026-07-14; storage O&M=0; SOC absolute_coef 0.05 for market 2026-08-03'
